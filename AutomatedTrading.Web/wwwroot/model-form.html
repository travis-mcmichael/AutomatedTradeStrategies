<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Model Config</title>
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .field.checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
    }
    label {
      font-size: 0.85rem;
      color: #555;
    }
    input[type="text"], select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.45rem 0.6rem;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    h2 {
      font-size: 1rem;
      margin: 1rem 0 0.4rem;
    }
    #features-table th, #features-table td {
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
    }
    #features-status {
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
    }
    #features-table tbody tr {
      cursor: pointer;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal {
      background: #ffffff;
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      min-width: 320px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 1rem;
    }
    .modal-close {
      appearance: none;
      border: none;
      background: none;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      color: #555;
      padding: 0;
    }
    .modal input[type="number"] {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      width: 8rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">&larr; Back to Models</a>
  <h1 id="page-title">Add Model</h1>

  <div id="form-status" class="status" hidden></div>

  <form id="model-form">
    <div class="form-row">
      <div class="field">
        <label for="modelName">Model Name</label>
        <input type="text" id="modelName" required />
      </div>
      <div class="field">
        <label for="version">Version</label>
        <input type="text" id="version" required />
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="instrument">Instrument</label>
        <input type="text" id="instrument" required />
      </div>
      <div class="field">
        <label for="target">Target</label>
        <select id="target" required>
          <option value="HIGH">HIGH</option>
          <option value="LOW">LOW</option>
          <option value="CLASS">CLASS</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="trainingStart">Training Start (YYYYMMDD)</label>
        <input type="text" id="trainingStart" required />
      </div>
      <div class="field">
        <label for="trainingEnd">Training End (YYYYMMDD)</label>
        <input type="text" id="trainingEnd" required />
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="barType">Bar Type</label>
        <select id="barType" required>
          <option value="session">session</option>
          <option value="window">window</option>
          <option value="minute">minute</option>
        </select>
      </div>
      <div></div>
    </div>

    <div class="form-row" id="window-fields-row">
      <div class="field">
        <label for="windowStart">Window Start (HHmmss)</label>
        <input type="text" id="windowStart" />
      </div>
      <div class="field">
        <label for="windowEnd">Window End (HHmmss)</label>
        <input type="text" id="windowEnd" />
      </div>
    </div>

    <div class="form-row">
      <div class="field checkbox">
        <input type="checkbox" id="export" />
        <label for="export">Export</label>
      </div>
      <div class="field checkbox">
        <input type="checkbox" id="active" />
        <label for="active">Active</label>
      </div>
    </div>

    <h2>Model Features</h2>
    <div id="features-status" class="status">No features for this model yet.</div>
    <table id="features-table" hidden>
      <thead>
        <tr>
          <th>Name</th>
          <th>Source</th>
          <th>Params</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn" href="index.html">Cancel</a>
    </div>
  </form>

  <div class="modal-overlay" id="param-modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="param-modal-title">Feature Parameters</h3>
        <button type="button" class="modal-close" id="param-modal-close" aria-label="Close">&times;</button>
      </div>
      <table id="param-modal-table">
        <thead>
          <tr>
            <th>Parameter</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="param-modal-save">Save</button>
        <button type="button" class="btn" id="param-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="lib/jquery/jquery.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const modelId = params.get("id");
    let existingModelFeatures = [];
    let existingFeatureLocation = "";
    let existingOutputLocation = "";
    let featureTypesById = {};
    let activeParamFeature = null;

    const form = document.getElementById("model-form");
    const status = document.getElementById("form-status");
    const barTypeSelect = document.getElementById("barType");
    const windowFieldsRow = document.getElementById("window-fields-row");
    const paramModalOverlay = document.getElementById("param-modal-overlay");
    const paramModalTitle = document.getElementById("param-modal-title");
    const paramModalBody = document.querySelector("#param-modal-table tbody");

    async function loadFeatureTypes() {
      try {
        const response = await fetch("/api/features");
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        const featureTypes = await response.json();
        featureTypesById = Object.fromEntries(featureTypes.map((f) => [f.id, f]));
      } catch (err) {
        showStatus(`Failed to load feature types: ${err.message}`, true);
      }
    }

    function showStatus(message, isError) {
      status.textContent = message;
      status.classList.toggle("error", !!isError);
      status.hidden = false;
    }

    function updateWindowFieldsVisibility() {
      windowFieldsRow.hidden = barTypeSelect.value !== "window";
    }

    barTypeSelect.addEventListener("change", updateWindowFieldsVisibility);

    function sourceToDisplay(source) {
      return source === "prevMinute" || source === "currMinute" ? source : "daily";
    }

    function paramDefsFor(feature) {
      return featureTypesById[feature.featureTypeId]?.featureTypeParams ?? [];
    }

    function formatParams(feature) {
      const keyById = Object.fromEntries(paramDefsFor(feature).map((p) => [p.id, p.parameterKey]));
      return (feature.modelFeatureParams ?? [])
        .map((p) => `${keyById[p.featureTypeParamId] ?? "?"}=${p.paramValue}`)
        .join(", ");
    }

    function renderFeatures() {
      const featuresStatus = document.getElementById("features-status");
      const featuresTable = document.getElementById("features-table");
      const tbody = featuresTable.querySelector("tbody");

      tbody.innerHTML = "";
      for (const feature of existingModelFeatures) {
        const row = document.createElement("tr");
        const cells = [
          feature.featureType?.name ?? "",
          sourceToDisplay(feature.source),
          formatParams(feature),
        ];
        for (const value of cells) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }
        row.addEventListener("click", () => openParamModal(feature));
        tbody.appendChild(row);
      }

      featuresStatus.hidden = existingModelFeatures.length > 0;
      featuresTable.hidden = existingModelFeatures.length === 0;
    }

    function openParamModal(feature) {
      activeParamFeature = feature;
      paramModalTitle.textContent = feature.featureType?.name ?? "Feature Parameters";

      const paramDefs = paramDefsFor(feature);
      const valueById = Object.fromEntries(
        (feature.modelFeatureParams ?? []).map((p) => [p.featureTypeParamId, p.paramValue]),
      );

      paramModalBody.innerHTML = "";
      for (const paramDef of paramDefs) {
        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        nameCell.textContent = paramDef.parameterKey;
        row.appendChild(nameCell);

        const valueCell = document.createElement("td");
        const input = document.createElement("input");
        input.type = "number";
        input.step = "1";
        input.dataset.featureTypeParamId = paramDef.id;
        input.value = valueById[paramDef.id] ?? 0;
        valueCell.appendChild(input);
        row.appendChild(valueCell);

        paramModalBody.appendChild(row);
      }

      paramModalOverlay.hidden = false;
    }

    function closeParamModal() {
      paramModalOverlay.hidden = true;
      activeParamFeature = null;
    }

    document.getElementById("param-modal-close").addEventListener("click", closeParamModal);
    document.getElementById("param-modal-cancel").addEventListener("click", closeParamModal);
    paramModalOverlay.addEventListener("click", (event) => {
      if (event.target === paramModalOverlay) closeParamModal();
    });

    document.getElementById("param-modal-save").addEventListener("click", () => {
      if (!activeParamFeature) return;

      const inputs = paramModalBody.querySelectorAll("input[data-feature-type-param-id]");
      activeParamFeature.modelFeatureParams = Array.from(inputs).map((input) => ({
        featureTypeParamId: Number(input.dataset.featureTypeParamId),
        paramValue: parseInt(input.value, 10) || 0,
      }));

      closeParamModal();
      renderFeatures();
    });

    function populateForm(model) {
      document.getElementById("modelName").value = model.modelName ?? "";
      document.getElementById("version").value = model.version ?? "";
      document.getElementById("instrument").value = model.instrument ?? "";
      document.getElementById("target").value = model.target ?? "HIGH";
      document.getElementById("trainingStart").value = model.trainingStart ?? "";
      document.getElementById("trainingEnd").value = model.trainingEnd ?? "";
      document.getElementById("barType").value = model.barType ?? "session";
      document.getElementById("windowStart").value = model.windowStart ?? "";
      document.getElementById("windowEnd").value = model.windowEnd ?? "";
      document.getElementById("export").checked = !!model.export;
      document.getElementById("active").checked = !!model.active;
      existingFeatureLocation = model.featureLocation ?? "";
      existingOutputLocation = model.outputLocation ?? "";
      existingModelFeatures = model.modelFeatures ?? [];
      updateWindowFieldsVisibility();
      renderFeatures();
    }

    async function loadExistingModel() {
      if (!modelId) return;

      document.getElementById("page-title").textContent = "Edit Model";
      try {
        const response = await fetch("/api/models");
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        const models = await response.json();
        const model = models.find((m) => String(m.id) === modelId);
        if (!model) {
          showStatus(`Model with id ${modelId} was not found.`, true);
          return;
        }
        populateForm(model);
      } catch (err) {
        showStatus(`Failed to load model: ${err.message}`, true);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.hidden = true;

      const payload = {
        id: modelId ? Number(modelId) : 0,
        modelName: document.getElementById("modelName").value,
        version: document.getElementById("version").value,
        instrument: document.getElementById("instrument").value,
        trainingStart: document.getElementById("trainingStart").value,
        trainingEnd: document.getElementById("trainingEnd").value,
        target: document.getElementById("target").value,
        barType: document.getElementById("barType").value,
        windowStart: document.getElementById("windowStart").value || null,
        windowEnd: document.getElementById("windowEnd").value || null,
        featureLocation: existingFeatureLocation,
        outputLocation: existingOutputLocation,
        export: document.getElementById("export").checked,
        active: document.getElementById("active").checked,
        modelFeatures: existingModelFeatures,
      };

      try {
        const response = await fetch("/api/models", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `Request failed: ${response.status}`);
        }
        location.href = "index.html?tab=models";
      } catch (err) {
        showStatus(`Failed to save model: ${err.message}`, true);
      }
    });

    async function init() {
      updateWindowFieldsVisibility();
      await loadFeatureTypes();
      renderFeatures();
      await loadExistingModel();
    }

    init();
  </script>
</body>
</html>
