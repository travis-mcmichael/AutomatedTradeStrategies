<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Automated Trading</title>
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .tabs {
      display: flex;
      border-bottom: 1px solid #d0d0d0;
      margin-bottom: 1.5rem;
    }
    .tab-button {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      cursor: pointer;
      color: #555;
    }
    .tab-button:hover {
      color: #111;
    }
    .tab-button.active {
      color: #111;
      border-bottom-color: #d6772f;
      font-weight: 600;
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    .models-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h1>Automated Trading</h1>

  <div class="tabs" role="tablist">
    <button class="tab-button active" data-tab="home" role="tab" aria-selected="true">Home</button>
    <button class="tab-button" data-tab="models" role="tab" aria-selected="false">Models</button>
  </div>

  <div class="tab-panel active" id="tab-home" role="tabpanel"></div>

  <div class="tab-panel" id="tab-models" role="tabpanel">
    <div class="models-toolbar">
      <a class="btn btn-primary" href="model-form.html">+ Add Model</a>
    </div>
    <div id="models-status" class="status">Loading models...</div>
    <table id="models-table" hidden>
      <thead>
        <tr>
          <th>Model Name</th>
          <th>Version</th>
          <th>Instrument</th>
          <th>Target</th>
          <th>Bar Type</th>
          <th>Export</th>
          <th>Active</th>
          <th>Feature Count</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="lib/jquery/jquery.min.js"></script>
  <script>
    const tabButtons = document.querySelectorAll(".tab-button");
    const tabs = $('.tab-button');
    const panels = $('.tab-panel');
    // console.log("js, jq", { tabButtons, tabButtons2});
    const tabPanels = document.querySelectorAll(".tab-panel");

  for (var i = 0; i < tabButtons2.length; i++)
  {
    console.log(tabButtons2.get(i));
  }

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tabButtons.forEach((b) => {
          b.classList.remove("active");
          b.setAttribute("aria-selected", "false");
        });
        tabPanels.forEach((p) => p.classList.remove("active"));

        button.classList.add("active");
        button.setAttribute("aria-selected", "true");
        document.getElementById(`tab-${button.dataset.tab}`).classList.add("active");
      });
    });

    async function loadModels() {
      const status = document.getElementById("models-status");
      const table = document.getElementById("models-table");
      const tbody = table.querySelector("tbody");

      try {
        const response = await fetch("/api/models");
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        const models = await response.json();

        tbody.innerHTML = "";
        for (const model of models) {
          const row = document.createElement("tr");
          const cells = [
            model.modelName ?? "",
            model.version ?? "",
            model.instrument ?? "",
            model.target ?? "",
            model.barType ?? "",
            model.export ? "Yes" : "No",
            model.active ? "Yes" : "No",
            model.modelFeatures?.length ?? 0,
          ];
          for (const value of cells) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          }

          const actionsCell = document.createElement("td");
          const editLink = document.createElement("a");
          editLink.className = "btn-link";
          editLink.href = `model-form.html?id=${encodeURIComponent(model.id)}`;
          editLink.textContent = "Edit";
          actionsCell.appendChild(editLink);
          row.appendChild(actionsCell);

          tbody.appendChild(row);
        }

        status.hidden = true;
        table.hidden = false;
      } catch (err) {
        status.textContent = `Failed to load models: ${err.message}`;
        status.classList.add("error");
      }
    }

    loadModels();

    const requestedTab = new URLSearchParams(location.search).get("tab");
    if (requestedTab) {
      document.querySelector(`.tab-button[data-tab="${requestedTab}"]`)?.click();
    }
  </script>
</body>
</html>
